        }
        .brigade-headers th.row-title {

        }
        .sub-header td {
            background-color: #E8FFEE;
            text-align: center;
            border: 1px solid #bfbfbf;
            padding: 4px;
            font-weight: bold;
        }
        .sub-header td.row-title {
            background-color: #d9d9d9;
            font-weight: normal;
        }
        /* Строки категорий */
        .category-row td {
            border: 1px solid #bfbfbf;
            vertical-align: top;
            padding: 0;
        }
        .category-row td.row-title {
            background-color: #595959;
            color: white;
            font-weight: bold;
            padding: 7px;
            vertical-align: middle;
            text-align: left;
        }
        /* Внутренняя таблица (СТАРШИХ) */
        .empST-table {			
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* Жестко фиксирует ширину колонок */			
        }
        .empST-table tr {
            height: 26px;
        }
        .empST-table td {
            border: 0px solid #d9d9d9 !important; 
            padding: 2px 2px;
            vertical-align: middle;
            overflow: hidden;
            white-space: nowrap;
	 }               		
		/* Внутренняя таблица (Строго фиксированная сетка) */
        .emp-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* Жестко фиксирует ширину колонок */
        }
        .emp-table tr {
            height: 11px;
        }
        /* Внутренняя сетка для ячеек сотрудников */
        .emp-table td {
            border: 1px solid #d9d9d9 !important; 
            padding: 0px 4px;
            vertical-align: middle;
            overflow: hidden;
            white-space: nowrap;
        }        
        /* Точные пропорции внутренних колонок внутри 100% ширины бригады */
        .col-id   { width: 12%; color: #888; text-align: center; font-weight: bold; }
        .col-name { width: 56%; }
        .col-role { width: 16%; color: #555; text-align: center; }
        .col-date { width: 16%; color: #c00000; text-align: right; font-size: 10px; }

        .select-input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid transparent;
            background-color: transparent;
